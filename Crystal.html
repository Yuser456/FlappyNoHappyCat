<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #000000;
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
  --accent: #5ee7ff;
  --text: #ffffff;
  --muted: #9aa4b2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  padding: 32px 24px;
  text-align: center;
}

header img {
  width: 80px;
  height: 80px;
  margin-bottom: 12px;
}

header h1 {
  font-size: 36px;
  font-weight: 800;
  margin: 0;
  letter-spacing: 1px;
}

header span {
  color: var(--accent);
}

header p {
  margin-top: 10px;
  color: var(--muted);
  font-size: 15px;
}

main {
  padding: 24px;
  max-width: 500px;
  margin: auto;
}

.card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(12px);
  text-align: center;
}

.card h3 {
  margin: 0 0 8px 0;
  font-size: 18px;
}

.card p {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 14px;
}

.button {
  display: inline-block;
  text-decoration: none;
  padding: 10px 16px;
  border-radius: 12px;
  background: var(--accent);
  color: #000;
  font-weight: 600;
  font-size: 14px;
}

footer {
  text-align: center;
  padding: 32px 20px;
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 480px) {
  header h1 {
    font-size: 28px;
  }
}
</style>
</head>
<body>

<header>
  <img src="https://img.freepik.com/free-vector/crystal-gem-blue-magic-gemstones-isolated-icons_107791-1257.jpg" alt="Crystal Studio Logo">
  <h1><span>Crystal</span> Studio</h1>
  <p>Creative studio founded by Tom · Projects, apps & experiments</p>
</header>

<main>
  <div class="card">
    <div class="tag">Experiment</div>
    <h3>Visual Lab</h3>
    <p>En création - Expériences visuelles et animations interactives.</p>
    <a class="button" href="#">Bientôt disponible</a>
  </div>
</main>

<footer>
  © 2025 Crystal Studio · Created by Tom
</footer>

</body>
</html>
